global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: qixuandata
    replica: h2

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "172.19.0.5:9093"
            - "172.19.0.3:9093"

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets:
          - "172.19.0.2:9100"
          - "172.19.0.5:9100"
          - "172.19.0.3:9100"
          - "172.19.0.4:9100"
        labels:
          layer: node

  # Exporters live on h1; the standby Prometheus reaches them over the network.
  - job_name: kafka
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ["172.19.0.5:9308"]

  - job_name: hdfs
    static_configs:
      - targets: ["172.19.0.5:9401"]

  - job_name: ambari
    static_configs:
      - targets: ["172.19.0.5:9402"]

  - job_name: flink
    static_configs:
      - targets: ["172.19.0.5:9403"]

  - job_name: flink_metrics
    static_configs:
      - targets: ["172.19.0.2:9249"]
        labels:
          instance: flink-jm-h0
      - targets: ["172.19.0.5:9249"]
        labels:
          instance: flink-jm-h1

  # Management plane exporter runs on the Docker host (172.19.0.1).
  - job_name: management
    static_configs:
      - targets: ["172.19.0.1:9404"]
